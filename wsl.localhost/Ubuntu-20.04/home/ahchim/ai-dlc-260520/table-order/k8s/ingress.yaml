---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: table-order-ingress
  namespace: table-order
  labels:
    app.kubernetes.io/part-of: table-order
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:ACCOUNT_ID:certificate/CERTIFICATE_ID
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/group.name: table-order
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /table-order/api
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 8081
          - path: /table-order/admin
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  number: 8082
          - path: /table-order
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
