---
# ServiceMonitor for Prometheus scraping
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: order-service-monitor
  namespace: table-order
  labels:
    app.kubernetes.io/part-of: table-order
    release: prometheus
spec:
  selector:
    matchLabels:
      app: order-service
  endpoints:
    - port: "8081"
      path: /api/v1/metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: admin-service-monitor
  namespace: table-order
  labels:
    app.kubernetes.io/part-of: table-order
    release: prometheus
spec:
  selector:
    matchLabels:
      app: admin-service
  endpoints:
    - port: "8082"
      path: /admin/api/v1/metrics
      interval: 30s
      scrapeTimeout: 10s
---
# Fluent Bit ConfigMap for log collection
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: table-order
  labels:
    app.kubernetes.io/part-of: table-order
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Tag               table-order.*
        Path              /var/log/containers/order-service*.log,/var/log/containers/admin-service*.log
        Parser            docker
        DB                /var/log/flb_table_order.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [FILTER]
        Name                kubernetes
        Match               table-order.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     table-order.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off

    [OUTPUT]
        Name                cloudwatch_logs
        Match               table-order.*
        region              ap-northeast-2
        log_group_name      /eks/table-order
        log_stream_prefix   from-fluent-bit-
        auto_create_group   true

  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On
---
# Fluent Bit DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: table-order
  labels:
    app: fluent-bit
    app.kubernetes.io/part-of: table-order
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
      annotations:
        # CloudWatch Container Insights
        cloudwatch.aws.amazon.com/container-insights: "true"
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: fluent-bit
          image: amazon/aws-for-fluent-bit:2.31.12
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: config
              mountPath: /fluent-bit/etc/
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: config
          configMap:
            name: fluent-bit-config
---
# ServiceAccount for Fluent Bit (IRSA for CloudWatch access)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: table-order
  labels:
    app.kubernetes.io/part-of: table-order
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/fluent-bit-cloudwatch-role
