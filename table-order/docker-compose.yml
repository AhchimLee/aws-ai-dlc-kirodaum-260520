version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: table_order
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-service:
    build: ./backend/api
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/table_order
      JWT_SECRET: local-dev-secret-key
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy

  admin-service:
    build: ./backend/admin
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/table_order
      JWT_SECRET: local-dev-secret-key
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      order-service:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - order-service
      - admin-service

volumes:
  pgdata:
