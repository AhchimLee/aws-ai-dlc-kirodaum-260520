apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: table-order-monitor
  namespace: table-order
  labels:
    app.kubernetes.io/part-of: table-order
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: table-order
  namespaceSelector:
    matchNames:
      - table-order
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
    - port: http
      path: /api/v1/healthz
      interval: 60s
      scrapeTimeout: 5s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: order-service-monitor
  namespace: table-order
  labels:
    app: order-service
    release: prometheus
spec:
  selector:
    matchLabels:
      app: order-service
  endpoints:
    - port: http
      path: /api/v1/healthz
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: admin-service-monitor
  namespace: table-order
  labels:
    app: admin-service
    release: prometheus
spec:
  selector:
    matchLabels:
      app: admin-service
  endpoints:
    - port: http
      path: /admin/api/v1/healthz
      interval: 30s
